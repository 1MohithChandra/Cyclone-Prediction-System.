<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyclone Prediction Model</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Background -->
    <div class="ambient-bg">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>


    <!-- Main Dashboard -->
    <div class="dashboard">

        <!-- Header -->
        <header class="fade-in">

            <h1>Cyclone Analysis</h1>

            <p>Advanced Meteorological Pattern Recognition</p>

        </header>


        <main class="fade-in">


            <!-- Prediction Form -->
            <form id="prediction-form" class="glass-panel">


                <div class="input-grid">


                    <!-- Sea Surface Temperature -->
                    <div class="field">

                        <label>Sea Surface Temp (°C)</label>

                        <input
                            type="number"
                            step="any"
                            id="sst"
                            value="28.5"
                            required
                        >

                    </div>


                    <!-- Atmospheric Pressure -->
                    <div class="field">

                        <label>Pressure (hPa)</label>

                        <input
                            type="number"
                            step="any"
                            id="pressure"
                            value="1005"
                            required
                        >

                    </div>


                    <!-- Humidity -->
                    <div class="field">

                        <label>Humidity (%)</label>

                        <input
                            type="number"
                            step="any"
                            id="humidity"
                            value="80"
                            required
                        >

                    </div>


                    <!-- Wind Shear -->
                    <div class="field">

                        <label>Wind Shear</label>

                        <input
                            type="number"
                            step="any"
                            id="shear"
                            value="15"
                            required
                        >

                    </div>


                    <!-- Vorticity -->
                    <div class="field">

                        <label>Vorticity</label>

                        <input
                            type="number"
                            step="any"
                            id="vorticity"
                            value="0.5"
                            required
                        >

                    </div>


                    <!-- Latitude -->
                    <div class="field">

                        <label>Latitude</label>

                        <input
                            type="number"
                            step="any"
                            id="lat"
                            value="15.0"
                            required
                        >

                    </div>


                    <!-- Ocean Depth -->
                    <div class="field">

                        <label>Ocean Depth (m)</label>

                        <input
                            type="number"
                            step="any"
                            id="depth"
                            value="50"
                            required
                        >

                    </div>


                    <!-- Proximity to Coast -->
                    <div class="field">

                        <label>Proximity to Coast (km)</label>

                        <input
                            type="number"
                            step="any"
                            id="coast"
                            value="100"
                            required
                        >

                    </div>


                    <!-- Prior Disturbance -->
                    <div class="field">

                        <label>Prior Disturbance</label>

                        <select id="disturbance" required>

                            <option value="1" selected>
                                Detected
                            </option>

                            <option value="0">
                                None
                            </option>

                        </select>

                    </div>


                </div>


                <!-- Buttons -->
                <div class="button-container">

                    <button
                        type="submit"
                        id="submit-btn"
                        class="predict-btn"
                    >
                        Run Prediction Model
                    </button>


                    <button
                        type="button"
                        id="reset-btn"
                        class="reset-btn"
                    >
                        Reset
                    </button>

                </div>


            </form>


            <!-- Results -->
            <div
                id="result-card"
                class="glass-panel result-panel hidden"
            >


                <!-- Prediction -->
                <h2 id="result-title"></h2>


                <!-- Classification -->
                <div
                    class="badge"
                    id="result-classification"
                ></div>


                <!-- Probability -->
                <div class="metrics">


                    <div class="metric-box">

                        <span class="label">
                            Cyclone Probability
                        </span>

                        <span
                            class="value accent-blue"
                            id="prob-yes"
                        ></span>

                    </div>


                    <div class="metric-box">

                        <span class="label">
                            Clear Probability
                        </span>

                        <span
                            class="value"
                            id="prob-no"
                        ></span>

                    </div>


                </div>


                <!-- Feature Importance -->
                <div class="feature-analysis">

                    <h3>
                        Primary Driving Factors
                    </h3>

                    <ul id="top-features"></ul>

                </div>


            </div>


        </main>

    </div>


    <!-- Animation Library -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
    ></script>


    <!-- JavaScript -->
    <script src="script.js"></script>


</body>

</html>
